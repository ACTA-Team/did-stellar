# CodeQL static analysis. Results appear under the repository's
# Security -> Code scanning tab and as inline annotations on pull requests.
#
# `build-mode: none` is correct for JavaScript/TypeScript: the extractor reads
# sources directly. Unlike ci.yml this workflow needs neither pnpm nor a turbo
# build, since CodeQL does not rely on cross-package type resolution.

name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly rescan so newly published queries reach code that has not changed.
    - cron: '23 5 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload the SARIF results to code scanning.
      security-events: write
      # Required by the CodeQL action to read the workflow run status.
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          # Scans the workflow files themselves for script injection and
          # untrusted checkout patterns. This repo publishes to npm and GHCR.
          - language: actions

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
