name: Docker

# Publishes the did:stellar resolver as a public container image.
#
# The DIF Universal Resolver does not consume a hosted URL — it pulls an
# image and runs it inside its own cluster, so the driver has to exist on
# a public registry with an explicit version tag (`:latest` is disallowed
# by the driver rules). GHCR is used rather than Docker Hub to avoid the
# anonymous-pull rate limits the Universal Resolver docs warn about.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Build the images on every PR without pushing.
  #
  # `pnpm build` at the root goes through Turbo, which follows the workspace
  # dependency graph, so a Dockerfile that names its build steps by hand can
  # fall out of sync with the graph and CI will never notice. That is exactly
  # what happened when the API gained a dependency on
  # @acta-team/did-stellar-indexer: every check was green and the image
  # failed to build on deploy. Building here is the only check that exercises
  # the Dockerfiles themselves.
  validate:
    name: Validate image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: did-stellar-api
            dockerfile: packages/api/Dockerfile
            smoke: true
          - name: did-stellar-indexer
            dockerfile: packages/indexer/Dockerfile
            smoke: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Single platform and no push: this validates the build, the release
      # job below is what produces the multi-arch published image.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.name }}:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the runtime stage actually boots, not just that tsc passed.
      # The indexer image has no HTTP surface, so only the API is probed.
      - name: Smoke-test ${{ matrix.name }}
        if: matrix.smoke
        run: |
          docker run -d --name smoke -p 8080:8080 "${{ matrix.name }}:pr"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker logs smoke
          docker rm -f smoke

  publish:
    name: Build and push driver-did-stellar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Release tags arrive as `v0.1.0`; the image tag drops the `v` so it
      # matches the version in packages/api/package.json. The owner is
      # lowercased because GHCR rejects uppercase in an image reference
      # (github.repository_owner is `ACTA-Team`).
      - name: Resolve image name and tag
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/driver-did-stellar"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not resolve an image tag"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image}:${tag}"

      # The docker/* actions are pinned to full commit SHAs rather than the
      # mutable `v3`/`v6` tags. This job holds `packages: write` and pushes a
      # signed image the Universal Resolver pulls, so a repointed tag would
      # let the action's owner publish under our name.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root: the Dockerfile COPYs pnpm-workspace.yaml
      # and packages/ from the workspace root. Root .dockerignore applies.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Universal Resolver CI resolves the configured testIdentifiers
      # against the published image — fail here rather than in their PR.
      - name: Smoke-test the published image
        run: |
          docker run -d --name driver -p 8080:8080 \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -H 'Accept: application/ld+json' \
            "http://localhost:8080/1.0/identifiers/did:stellar:testnet:znfxngsh46vkyqu6inrx4omphi" \
            | tee /dev/stderr | grep -q '"didDocument"'
          docker rm -f driver
